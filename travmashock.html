                ],
                correct: 2,
                explanation: "Повторное замерзание уже отогретой конечности приводит к необратимому тромбозу и гангрене. Если нет возможности сразу поместить пострадавшего в тепло до этапа госпиталя, накладывается термоизолирующая повязка."
            }
        ];

        // --- СОСТОЯНИЕ ПРИЛОЖЕНИЯ ---
        let currentModuleIndex = 0;
        let completedModules = new Set([0]);
        let currentQuizIndex = 0;
        let quizScore = 0;
        let quizAnswered = false;

        // --- ИНИЦИАЛИЗАЦИЯ И РЕНДЕР ---
        function init() {
            renderSidebar();
            loadModule(0);
            setupEventListeners();
        }

        function renderSidebar() {
            const navMenu = document.getElementById('navMenu');
            navMenu.innerHTML = modules.map((mod, idx) => {
                const isActive = idx === currentModuleIndex;
                const isDone = completedModules.has(idx);
                return `
                    <button onclick="loadModule(${idx})" class="w-full text-left px-3 py-2.5 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-between transition ${isActive ? 'tab-active font-semibold' : 'text-slate-300 hover:bg-slate-800/70 hover:text-white'}">
                        <div class="flex items-center gap-2.5 truncate pr-2">
                            <i data-lucide="${mod.icon}" class="w-4 h-4 flex-shrink-0 ${isActive ? 'text-emerald-400' : 'text-slate-400'}"></i>
                            <span class="truncate">${mod.shortTitle}</span>
                        </div>
                        ${isDone ? '<i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-500 flex-shrink-0"></i>' : ''}
                    </button>
                `;
            }).join('');

            // Обновление прогресс-бара
            const progressPercent = Math.round((completedModules.size / modules.length) * 100);
            document.getElementById('progressText').textContent = `${completedModules.size} / ${modules.length}`;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            lucide.createIcons();
        }

        function loadModule(index) {
            currentModuleIndex = index;
            completedModules.add(index); // Автоматически засчитываем просмотр
            const mod = modules[index];

            document.getElementById('moduleBadge').textContent = mod.badge;
            document.getElementById('moduleTitle').textContent = mod.title;

            const container = document.getElementById('contentContainer');
            container.classList.remove('fade-in');
            void container.offsetWidth; // Перезапуск CSS-анимации
            container.classList.add('fade-in');
            container.innerHTML = mod.render();

            // Инициализация специфических модулей
            if (index === 7) {
                filterKit('all');
            } else if (index === 8) {
                renderQuiz();
            }

            // Управление кнопками Назад/Далее
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === modules.length - 1;

            // Закрытие мобильного меню при переходе
            closeMobileMenu();
            renderSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- ЛОГИКА ФИЛЬТРАЦИИ АПТЕЧКИ (МОДУЛЬ 8) ---
        function filterKit(category) {
            const buttons = document.querySelectorAll('.kit-filter-btn');
            buttons.forEach(btn => {
                if (btn.dataset.cat === category) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300');
                    btn.classList.add('bg-emerald-600', 'text-white');
                } else {
                    btn.classList.add('bg-slate-800', 'text-slate-300');
                    btn.classList.remove('bg-emerald-600', 'text-white');
                }
            });

            const filtered = category === 'all' ? kitItems : kitItems.filter(item => item.cat === category);
            const grid = document.getElementById('kitGrid');
            grid.innerHTML = filtered.map(item => `
                <div class="bg-slate-800/50 border border-slate-700/80 hover:border-emerald-500/50 rounded-xl p-4 flex flex-col justify-between transition">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2.5">
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded ${item.tagColor}">${item.tag}</span>
                            <span class="text-xs font-bold text-slate-200 bg-slate-900 px-2.5 py-0.5 rounded-md border border-slate-700">${item.qty}</span>
                        </div>
                        <h4 class="font-bold text-white text-sm mb-2 leading-snug">${item.name}</h4>
                        <p class="text-xs text-slate-300 leading-relaxed">${item.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        // --- ЛОГИКА СИМУЛЯТОРА / ТЕСТИРОВАНИЯ (МОДУЛЬ 9) ---
        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            if (currentQuizIndex >= quizQuestions.length) {
                container.innerHTML = `
                    <div class="text-center py-6 space-y-4">
                        <div class="inline-flex p-4 rounded-full bg-emerald-500/20 text-emerald-400 mb-2">
                            <i data-lucide="award" class="w-12 h-12"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-white">Симуляция завершена!</h3>
                        <p class="text-slate-300 text-base">Ваш результат: <strong class="text-emerald-400 text-xl">${quizScore} из ${quizQuestions.length}</strong> правильных клинических решений.</p>
                        <div class="pt-4">
                            <button onclick="restartQuiz()" class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm transition inline-flex items-center gap-2">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                <span>Пройти симулятор заново</span>
                            </button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const q = quizQuestions[currentQuizIndex];
            quizAnswered = false;

            container.innerHTML = `
                <div class="flex items-center justify-between text-xs text-slate-400 mb-4 pb-3 border-b border-slate-800">
                    <span class="font-semibold text-emerald-400">КЛИНИЧЕСКАЯ ЗАДАЧА ${currentQuizIndex + 1} ИЗ ${quizQuestions.length}</span>
                    <span>Текущий счет: <strong class="text-white">${quizScore}</strong></span>
                </div>
                <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 sm:p-5 mb-5">
                    <p class="text-sm sm:text-base text-white font-medium leading-relaxed">${q.scenario}</p>
                </div>
                <div class="space-y-2.5" id="quizOptions">
                    ${q.options.map((opt, i) => `
                        <button onclick="selectAnswer(${i})" class="quiz-opt-btn w-full text-left p-4 rounded-xl bg-slate-800/40 hover:bg-slate-800 border border-slate-700 text-sm text-slate-200 transition flex items-start gap-3">
                            <span class="w-6 h-6 rounded-full bg-slate-700 text-slate-300 font-bold text-xs flex items-center justify-center flex-shrink-0 mt-0.5">${String.fromCharCode(65 + i)}</span>
                            <span>${opt}</span>
                        </button>
                    `).join('')}
                </div>
                <div id="quizFeedback" class="hidden mt-5 p-4 rounded-xl text-sm leading-relaxed"></div>
                <div id="quizNextWrapper" class="hidden mt-5 flex justify-end">
                    <button onclick="nextQuestion()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm transition flex items-center gap-2">
                        <span>${currentQuizIndex === quizQuestions.length - 1 ? 'Завершить тест' : 'Следующая задача'}</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
            lucide.createIcons();
        }

        function selectAnswer(selectedIndex) {
            if (quizAnswered) return;
            quizAnswered = true;

            const q = quizQuestions[currentQuizIndex];
            const isCorrect = selectedIndex === q.correct;
            if (isCorrect) quizScore++;

            const buttons = document.querySelectorAll('.quiz-opt-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.classList.remove('bg-slate-800/40', 'border-slate-700');
                    btn.classList.add('bg-emerald-950/60', 'border-emerald-500', 'text-emerald-200');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.remove('bg-slate-800/40', 'border-slate-700');
                    btn.classList.add('bg-red-950/60', 'border-red-500', 'text-red-200');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            const feedback = document.getElementById('quizFeedback');
            feedback.classList.remove('hidden');
            feedback.classList.add(isCorrect ? 'bg-emerald-950/40' : 'bg-red-950/40', 'border', isCorrect ? 'border-emerald-700' : 'border-red-700', isCorrect ? 'text-emerald-200' : 'text-red-200');
            feedback.innerHTML = `
                <strong class="block font-bold mb-1 ${isCorrect ? 'text-emerald-400' : 'text-red-400'}">
                    ${isCorrect ? '✓ Верное клиническое решение!' : '✕ Ошибка тактики!'}
                </strong>
                ${q.explanation}
            `;

            document.getElementById('quizNextWrapper').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuizIndex++;
            renderQuiz();
        }

        function restartQuiz() {
            currentQuizIndex = 0;
            quizScore = 0;
            renderQuiz();
        }

        // --- МОБИЛЬНОЕ МЕНЮ И СОБЫТИЯ ---
        function openMobileMenu() {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.remove('hidden');
        }

        function closeMobileMenu() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.add('hidden');
        }

        function setupEventListeners() {
            document.getElementById('mobileMenuBtn').addEventListener('click', openMobileMenu);
            document.getElementById('sidebarOverlay').addEventListener('click', closeMobileMenu);

            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentModuleIndex > 0) loadModule(currentModuleIndex - 1);
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (currentModuleIndex < modules.length - 1) loadModule(currentModuleIndex + 1);
            });

            document.getElementById('markCompletedBtn').addEventListener('click', () => {
                completedModules.add(currentModuleIndex);
                renderSidebar();
                if (currentModuleIndex < modules.length - 1) {
                    loadModule(currentModuleIndex + 1);
                }
            });
        }

        // Запуск при загрузке страницы
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
